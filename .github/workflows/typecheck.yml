name: TypeCheck

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.ts'
      - '**.tsx'
      - '**/tsconfig.json'
      - '**/tsconfig.*.json'
      - 'bun.lock'
      - 'package.json'
      - 'packages/*/package.json'
      - 'shared/*/package.json'
      - '.github/workflows/typecheck.yml'
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - '**/tsconfig.json'
      - '**/tsconfig.*.json'
      - 'bun.lock'
      - 'package.json'
      - 'packages/*/package.json'
      - 'shared/*/package.json'
      - '.github/workflows/typecheck.yml'

defaults:
  run:
    shell: 'bash'

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared packages
        run: bun run --filter "@bigcapital/utils" --filter "@bigcapital/email-components" --filter "@bigcapital/pdf-templates" build

      - name: Run TypeScript type check
        run: bun run typecheck
