# =============================================================================
# Bigcapital — Alwathba deployment for Dokploy (prebuilt Docker Hub images)
# =============================================================================
# This compose file is the Dokploy variant of docker-compose.alwathba.yml.
# Instead of building server/webapp from source, it pulls prebuilt images from
# Docker Hub. Images are produced by .github/workflows/docker-alwathba.yml on
# every push to the alwathba-merged branch and published under the moving tag
# `alwathba` (plus an immutable `alwathba-<sha>` tag for rollback).
#
# Differences vs docker-compose.alwathba.yml:
#   * No `build:` sections — server/webapp/migration use
#     ${DOCKERHUB_USER}/bigcapital-{server,webapp}:alwathba.
#   * The Envoy `proxy` publishes NO host port. Dokploy's Traefik routes the
#     configured domain to the proxy container on the internal port 80, so the
#     proxy must be attached to the external `dokploy-network`. Traefik then
#     cannot collide with Envoy on host port 80.
#   * mysql/redis publish no host ports (internal-only; prod security).
#
# Setup (Dokploy UI):
#   1. Project -> Docker Compose -> repo shihabbinali/bigcapital,
#      branch alwathba-merged, compose path docker-compose.dokploy.yml
#   2. Environment tab: copy .env.alwathba.example values + DOCKERHUB_USER
#   3. Domains tab: add domain, service `proxy`, container port 80, HTTPS on
#   4. Project settings: copy the Deploy Hook URL into GitHub Actions secret
#      DOKPLOY_DEPLOY_WEBHOOK (the workflow calls it after pushing images).
#   5. DNS: A record pointing at the server IP, then deploy.
#
# Auto-update flow: git push -> GitHub Actions builds & pushes both images ->
# calls the Dokploy deploy webhook -> Dokploy runs `docker compose up -d`,
# which recreates containers and re-runs the migration one-shot.
#
# See docs/DEPLOYMENT.md for the full walkthrough.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy (HTTP only). Routes /api -> server, everything else -> webapp.
  # Dokploy's Traefik terminates TLS and forwards to this container on :80.
  # ---------------------------------------------------------------------------
  proxy:
    image: envoyproxy/envoy:v1.30-latest
    depends_on:
      server:
        condition: service_healthy
      webapp:
        condition: service_started
    volumes:
      - ./docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    restart: unless-stopped
    networks:
      - bigcapital_network
      - dokploy-network

  # ---------------------------------------------------------------------------
  # Frontend — prebuilt image from Docker Hub (packages/webapp/Dockerfile).
  # ---------------------------------------------------------------------------
  webapp:
    container_name: alwathba-webapp
    image: ${DOCKERHUB_USER:?}/bigcapital-webapp:alwathba-6a52491e0458cc760c168b575e1b82c9d935eb4f
    restart: unless-stopped
    networks:
      - bigcapital_network

  # ---------------------------------------------------------------------------
  # API server — prebuilt image from Docker Hub (packages/server/Dockerfile).
  # The same image is reused (migration one-shot below) so schema and runtime
  # always stay in lockstep.
  # ---------------------------------------------------------------------------
  server:
    container_name: alwathba-server
    image: ${DOCKERHUB_USER:?}/bigcapital-server:alwathba-6a52491e0458cc760c168b575e1b82c9d935eb4f
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - bigcapital_network
    environment:
      # --- Mail ---
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}

      # --- Database (shared by system + tenants unless overridden) ---
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET:-utf8}

      # --- System database ---
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME:-bigcapital_system}

      # --- Redis (cache + queues) ---
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_HOST=redis
      - QUEUE_PORT=6379

      # --- Tenant databases ---
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}

      # --- Authentication ---
      # NOTE: the server reads APP_JWT_SECRET, not JWT_SECRET.
      - APP_JWT_SECRET=${APP_JWT_SECRET:?}

      # --- Application ---
      - BASE_URL=${BASE_URL}

      # --- Self-host flag (disables forced cloud subscription screen, #1071) ---
      - HOSTED_ON_BIGCAPITAL_CLOUD=false

      # --- Sign-up restrictions ---
      - SIGNUP_DISABLED=${SIGNUP_DISABLED:-false}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS}

      # --- Sign-up email confirmation ---
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION:-false}

      # --- API throttling ---
      - THROTTLE_GLOBAL_TTL=${THROTTLE_GLOBAL_TTL:-60000}
      - THROTTLE_GLOBAL_LIMIT=${THROTTLE_GLOBAL_LIMIT:-300}
      - THROTTLE_AUTH_TTL=${THROTTLE_AUTH_TTL:-60000}
      - THROTTLE_AUTH_LIMIT=${THROTTLE_AUTH_LIMIT:-30}

      # --- Gotenberg (PDF rendering). gotenberg:7 listens on 3000 internally ---
      - GOTENBERG_URL=http://gotenberg:3000
      - GOTENBERG_DOCS_URL=http://server:3000/public/

      # --- Exchange rate ---
      - EXCHANGE_RATE_SERVICE=${EXCHANGE_RATE_SERVICE:-open-exchange-rate}
      - OPEN_EXCHANGE_RATE_APP_ID=${OPEN_EXCHANGE_RATE_APP_ID}

      # --- Bank sync / Plaid ---
      - BANK_FEED_ENABLED=${BANK_FEED_ENABLED:-false}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - PLAID_LINK_WEBHOOK=${PLAID_LINK_WEBHOOK}

      # --- Lemon Squeezy ---
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY}
      - LEMONSQUEEZY_STORE_ID=${LEMONSQUEEZY_STORE_ID}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET}

      # --- New Relic (optional) ---
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED:-false}
      - NEW_RELIC_LOG=${NEW_RELIC_LOG:-false}
      - NEW_RELIC_AI_MONITORING_ENABLED=${NEW_RELIC_AI_MONITORING_ENABLED:-false}
      - NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED=${NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED:-0}
      - NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED=${NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED:-0}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME}

      # --- S3 (Cloudflare R2) ---
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_FORCE_PATH_STYLE=true

      # --- Stripe ---
      - STRIPE_PAYMENT_SECRET_KEY=${STRIPE_PAYMENT_SECRET_KEY}
      - STRIPE_PAYMENT_PUBLISHABLE_KEY=${STRIPE_PAYMENT_PUBLISHABLE_KEY}
      - STRIPE_PAYMENT_CLIENT_ID=${STRIPE_PAYMENT_CLIENT_ID}
      - STRIPE_PAYMENT_WEBHOOKS_SECRET=${STRIPE_PAYMENT_WEBHOOKS_SECRET}
      - STRIPE_PAYMENT_REDIRECT_URL=${STRIPE_PAYMENT_REDIRECT_URL}

  # ---------------------------------------------------------------------------
  # Database migrations — one-shot that REUSES the server image from Docker Hub
  # (same tag the server runs). Runs system + tenant migrations, then exits.
  # ---------------------------------------------------------------------------
  migration:
    container_name: alwathba-migration
    image: ${DOCKERHUB_USER:?}/bigcapital-server:alwathba-6a52491e0458cc760c168b575e1b82c9d935eb4f
    # The CLI resolves migration paths relative to the package dir, so mirror
    # the upstream migration image's WORKDIR exactly.
    working_dir: /app/packages/server
    command:
      - sh
      - -c
      - "bun src/cli.ts system:migrate:latest && bun src/cli.ts tenants:migrate:latest"
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bigcapital_network
    environment:
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET:-utf8}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME:-bigcapital_system}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}

  # ---------------------------------------------------------------------------
  # MariaDB 10.2 (kept on upstream version for compatibility; note: EOL).
  # Built from ./docker/mariadb — the init.sql grant on *.* is REQUIRED so the
  # app user can create per-tenant databases at runtime. No host port: only
  # reachable from the compose network.
  # ---------------------------------------------------------------------------
  mysql:
    container_name: alwathba-mysql
    build:
      context: ./docker/mariadb
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME:-bigcapital_system}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    # mysqladmin ping is the universal healthcheck; works on mariadb:10.2.
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -u root -p"${DB_ROOT_PASSWORD}"']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - bigcapital_network

  # ---------------------------------------------------------------------------
  # Redis (cache + job queues). Built from ./docker/redis. No host port.
  # ---------------------------------------------------------------------------
  redis:
    container_name: alwathba-redis
    build:
      context: ./docker/redis
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - bigcapital_network

  # ---------------------------------------------------------------------------
  # Gotenberg — PDF/Office conversion. Listens on port 3000 inside the image.
  # ---------------------------------------------------------------------------
  gotenberg:
    container_name: alwathba-gotenberg
    image: gotenberg/gotenberg:7
    restart: unless-stopped
    networks:
      - bigcapital_network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql:
    name: alwathba_mysql
    driver: local
  redis:
    name: alwathba_redis
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  bigcapital_network:
    driver: bridge
  # Pre-created by Dokploy (Traefik lives on it). The proxy joins it so
  # Dokploy's Traefik can reach the app; nothing else is exposed to it.
  dokploy-network:
    external: true
