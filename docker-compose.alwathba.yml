# =============================================================================
# Bigcapital — Alwathba self-hosted (build-from-source) stack
# =============================================================================
# This compose file builds every application image from the LOCAL source tree
# (no Docker Hub images are pulled for server/webapp/migration), and fixes the
# environment-variable bugs present in the upstream docker-compose.prod.yml:
#
#   * JWT secret: the server reads APP_JWT_SECRET (NOT JWT_SECRET). Upstream
#     passes JWT_SECRET, so the secret silently falls back to the hard-coded
#     "123123" (packages/server/src/common/config/jwt.ts). We pass APP_JWT_SECRET.
#   * OPEN_EXCHANGE_RATE_APP_ID: upstream has a typo (- instead of =). Fixed.
#   * HOSTED_ON_BIGCAPITAL_CLOUD=false to avoid the forced subscription screen
#     on self-hosted instances (upstream issue #1071).
#   * Real healthchecks + depends_on conditions so the server never starts
#     before the database is ready and migrations have completed.
#
# Usage:
#   cp .env.alwathba.example .env.alwathba   # then edit secrets
#   docker compose -f docker-compose.alwathba.yml --env-file .env.alwathba up -d --build
#
# Envoy is HTTP-only here. Terminate TLS with an external reverse proxy
# (Traefik / Caddy / Nginx / Dokploy) in front. See docs/DEPLOYMENT.md.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy (HTTP only). Routes /api -> server, everything else -> webapp.
  # ---------------------------------------------------------------------------
  proxy:
    image: envoyproxy/envoy:v1.30-latest
    depends_on:
      server:
        condition: service_healthy
      webapp:
        condition: service_started
    ports:
      - '127.0.0.1:${PUBLIC_PROXY_PORT:-80}:80'
    volumes:
      - ./docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    restart: unless-stopped
    networks:
      - bigcapital_network

  # ---------------------------------------------------------------------------
  # Frontend — built from local source (packages/webapp/Dockerfile).
  # ---------------------------------------------------------------------------
  webapp:
    container_name: alwathba-webapp
    image: bigcapital-webapp:local
    build:
      context: .
      dockerfile: packages/webapp/Dockerfile
    restart: unless-stopped
    networks:
      - bigcapital_network

  # ---------------------------------------------------------------------------
  # API server — built from local source (packages/server/Dockerfile).
  # The same image is reused (tag bigcapital-server:local) by the migration
  # one-shot below, guaranteeing schema/runtime stay in lockstep.
  # ---------------------------------------------------------------------------
  server:
    container_name: alwathba-server
    image: bigcapital-server:local
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - bigcapital_network
    environment:
      # --- Mail ---
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}

      # --- Database (shared by system + tenants unless overridden) ---
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET:-utf8}

      # --- System database ---
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME:-bigcapital_system}

      # --- Redis (cache + queues) ---
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_HOST=redis
      - QUEUE_PORT=6379

      # --- Tenant databases ---
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}

      # --- Authentication ---
      # NOTE: the server reads APP_JWT_SECRET, not JWT_SECRET.
      - APP_JWT_SECRET=${APP_JWT_SECRET:?}

      # --- Application ---
      - BASE_URL=${BASE_URL}

      # --- Self-host flag (disables forced cloud subscription screen, #1071) ---
      - HOSTED_ON_BIGCAPITAL_CLOUD=false

      # --- Sign-up restrictions ---
      - SIGNUP_DISABLED=${SIGNUP_DISABLED:-false}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS}

      # --- Sign-up email confirmation ---
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION:-false}

      # --- API throttling ---
      - THROTTLE_GLOBAL_TTL=${THROTTLE_GLOBAL_TTL:-60000}
      - THROTTLE_GLOBAL_LIMIT=${THROTTLE_GLOBAL_LIMIT:-300}
      - THROTTLE_AUTH_TTL=${THROTTLE_AUTH_TTL:-60000}
      - THROTTLE_AUTH_LIMIT=${THROTTLE_AUTH_LIMIT:-30}

      # --- Gotenberg (PDF rendering). gotenberg:7 listens on 3000 internally ---
      - GOTENBERG_URL=http://gotenberg:3000
      - GOTENBERG_DOCS_URL=http://server:3000/public/

      # --- Exchange rate ---
      - EXCHANGE_RATE_SERVICE=${EXCHANGE_RATE_SERVICE:-open-exchange-rate}
      - OPEN_EXCHANGE_RATE_APP_ID=${OPEN_EXCHANGE_RATE_APP_ID}

      # --- Bank sync / Plaid ---
      - BANK_FEED_ENABLED=${BANK_FEED_ENABLED:-false}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - PLAID_LINK_WEBHOOK=${PLAID_LINK_WEBHOOK}

      # --- Lemon Squeezy ---
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY}
      - LEMONSQUEEZY_STORE_ID=${LEMONSQUEEZY_STORE_ID}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET}

      # --- New Relic (optional) ---
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED:-false}
      - NEW_RELIC_LOG=${NEW_RELIC_LOG:-false}
      - NEW_RELIC_AI_MONITORING_ENABLED=${NEW_RELIC_AI_MONITORING_ENABLED:-false}
      - NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED=${NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED:-0}
      - NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED=${NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED:-0}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME}

      # --- S3 (documents & attachments) ---
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}

      # --- Stripe ---
      - STRIPE_PAYMENT_SECRET_KEY=${STRIPE_PAYMENT_SECRET_KEY}
      - STRIPE_PAYMENT_PUBLISHABLE_KEY=${STRIPE_PAYMENT_PUBLISHABLE_KEY}
      - STRIPE_PAYMENT_CLIENT_ID=${STRIPE_PAYMENT_CLIENT_ID}
      - STRIPE_PAYMENT_WEBHOOKS_SECRET=${STRIPE_PAYMENT_WEBHOOKS_SECRET}
      - STRIPE_PAYMENT_REDIRECT_URL=${STRIPE_PAYMENT_REDIRECT_URL}

  # ---------------------------------------------------------------------------
  # Database migrations — one-shot that REUSES the locally built server image
  # (no Docker Hub dependency). Runs system + tenant migrations, then exits.
  # Replaces upstream docker/migration/Dockerfile + wait-for-it with a real
  # healthcheck dependency on mysql.
  # ---------------------------------------------------------------------------
  migration:
    container_name: alwathba-migration
    image: bigcapital-server:local
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    # The CLI resolves migration paths relative to the package dir, so mirror
    # the upstream migration image's WORKDIR exactly.
    working_dir: /app/packages/server
    command:
      - sh
      - -c
      - 'node dist/cli.js system:migrate:latest && node dist/cli.js tenants:migrate:latest'
    restart: 'no'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bigcapital_network
    environment:
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET:-utf8}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME:-bigcapital_system}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}

  # ---------------------------------------------------------------------------
  # MariaDB 10.2 (kept on upstream version for compatibility; note: EOL).
  # ---------------------------------------------------------------------------
  mysql:
    container_name: alwathba-mysql
    build:
      context: ./docker/mariadb
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME:-bigcapital_system}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    # mysqladmin ping is the universal healthcheck; works on mariadb:10.2.
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - bigcapital_network

  # ---------------------------------------------------------------------------
  # Redis (cache + job queues).
  # ---------------------------------------------------------------------------
  redis:
    container_name: alwathba-redis
    build:
      context: ./docker/redis
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - bigcapital_network

  # ---------------------------------------------------------------------------
  # Gotenberg — PDF/Office conversion. Listens on port 3000 inside the image.
  # ---------------------------------------------------------------------------
  gotenberg:
    container_name: alwathba-gotenberg
    image: gotenberg/gotenberg:7
    restart: unless-stopped
    networks:
      - bigcapital_network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql:
    name: alwathba_mysql
    driver: local
  redis:
    name: alwathba_redis
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  bigcapital_network:
    driver: bridge
